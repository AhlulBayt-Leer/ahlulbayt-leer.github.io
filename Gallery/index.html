<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery / گالری تصاویر</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #1e3a8a; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 30px auto; }
        .gallery-item img { width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #1e3a8a; color: #fff; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Galerie / گالری تصاویر</h1>
    <div class="gallery-grid">
        <div class="gallery-item"><img src="b3.jpeg" alt="Bild 3"></div>
        <div class="gallery-item"><img src="b5.jpeg" alt="Bild 5"></div>
        <div class="gallery-item"><img src="b6.jpeg" alt="Bild 6"></div>
        <div class="gallery-item"><img src="b9.jpeg" alt="Bild 9"></div>
    </div>
    <a href="../index.html" class="back-btn">&larr; Zurück zur Startseite / بازگشت به صفحه اصلی</a>
</body>
</html>
